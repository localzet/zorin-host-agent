name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go test ./...
      - run: make build
      - uses: actions/upload-artifact@v4
        with: {name: host-agent, path: dist/}
